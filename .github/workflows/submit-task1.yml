name: Submit Task 1 to TIRA

on:
  workflow_dispatch:
    inputs:
      candidate_k:
        description: 'BM25 candidate pool for description-based reranking'
        type: choice
        options:
          - '50'
          - '100'
        default: '100'
      spot_check_dataset:
        description: 'Public collection to validate before upload'
        type: choice
        options:
          - retrieval-de-spot-check-20260816-training
          - retrieval-en-spot-check-20260816-training
          - retrieval-hessian-law-de-spot-check-20260902-training
        default: retrieval-de-spot-check-20260816-training
      semantic_mode:
        description: 'Semantic detection (audit preserves every document)'
        type: choice
        options:
          - 'off'
          - 'audit'
        default: 'off'

permissions:
  contents: read

concurrency:
  group: tira-task1-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
      PYTHONUNBUFFERED: '1'
      VERA_DOCKER_TIMEOUT_SECONDS: '600'
      SEMANTIC_MODE: ${{ inputs.semantic_mode }}
      CANDIDATE_K: ${{ inputs.candidate_k }}
      SPOT_CHECK_DATASET: ${{ inputs.spot_check_dataset }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install submission client
        run: python -m pip install -r development/task1/requirements-cli.txt

      - name: Authenticate with TIRA
        env:
          TIRA_TOKEN: ${{ secrets.TIRA_TOKEN }}
        run: |
          if [ -z "$TIRA_TOKEN" ]; then
            echo 'Add the TIRA_TOKEN repository secret before running this workflow.'
            exit 1
          fi
          python development/task1/scripts/tira_cli_local.py login --token "$TIRA_TOKEN"

      - name: Check runner storage and Git status
        run: |
          df -h .
          docker info --format '{{.Driver}}'
          test -z "$(git status --porcelain)"

      - name: Build, spot-check, and upload Task 1
        run: |
          include_semantic=0
          if [ "$SEMANTIC_MODE" = "audit" ]; then include_semantic=1; fi
          case "$CANDIDATE_K" in 50|100) ;; *) echo 'Candidate pool must be 50 or 100'; exit 1 ;; esac
          python development/task1/scripts/tira_cli_local.py code-submission \
            --path task1-retrieval \
            --task uniagent-2026 \
            --tira-vm-id vera \
            --dataset "$SPOT_CHECK_DATASET" \
            --platform linux/amd64 \
            --build-args="--output type=docker --provenance=false --build-arg INCLUDE_SEMANTIC_MODEL=$include_semantic" \
            --command "python3 /app/submission.py --dataset \$inputDataset --output \$outputDir --candidate-k $CANDIDATE_K --semantic-mode $SEMANTIC_MODE --ranking-strategy cross-encoder"

      - name: Record completion
        run: |
          echo 'Task 1 uploaded to TIRA for team vera. Find its generated name in the upload step logs.' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate pool: $CANDIDATE_K; semantic mode: $SEMANTIC_MODE; ranking: cross-encoder." >> "$GITHUB_STEP_SUMMARY"
          echo 'Select that software in UniAgent 2026 on TIRA to launch remote evaluation.' >> "$GITHUB_STEP_SUMMARY"
